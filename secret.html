<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Le petit secret de Catherine & Freddy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 20px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Georgia, "Times New Roman", serif;
      text-align: center;

      color: #3f493f;

      background:
        radial-gradient(
          circle at center,
          #ffffff 0%,
          #f8f4ec 55%,
          #e9e2d5 100%
        );
    }

    .contenu {
      width: 100%;
      max-width: 600px;
    }

    .quiz {
      background: white;
      padding: 40px 30px;

      border-radius: 20px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.10);
    }

    .petit-titre {
      font-family: Arial, sans-serif;

      font-size: 12px;
      letter-spacing: 3px;

      text-transform: uppercase;

      color: #71806c;

      margin-bottom: 20px;
    }

    .coeur {
      font-size: 36px;
      margin-bottom: 15px;
    }

    h1 {
      color: #71806c;

      font-size: 34px;
      font-weight: normal;

      margin: 10px 0 20px;
    }

    .question {
      font-size: 21px;
      line-height: 1.5;

      margin-bottom: 30px;
    }

    .reponses {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }

    .reponse {
      padding: 16px 10px;

      border: 1px solid #d7dcd4;
      border-radius: 14px;

      background: #faf8f3;

      color: #3f493f;

      font-family: Arial, sans-serif;
      font-size: 15px;

      cursor: pointer;

      transition: 0.2s;
    }

    .reponse:hover {
      background: #71806c;
      color: white;

      transform: translateY(-2px);
    }

    #message {
      min-height: 50px;

      margin-top: 25px;

      font-size: 18px;
      line-height: 1.5;
    }

    .erreur {
      color: #a45d57;
    }

    .bravo {
      color: #71806c;
      font-weight: bold;
    }

    #bouton-suite {
      display: none;

      margin-top: 10px;

      padding: 14px 25px;

      border: none;
      border-radius: 30px;

      background: #71806c;

      color: white;

      font-family: Arial, sans-serif;
      font-size: 15px;

      cursor: pointer;
    }

    #bouton-suite:hover {
      background: #596653;
    }

    /* SURPRISE */

    #surprise {
      display: none;
    }

    .photo {
      display: block;

      width: 100%;
      max-width: 500px;

      margin: auto;

      border-radius: 20px;

      box-shadow:
        0 12px 35px rgba(0,0,0,0.15);
    }

    .titre-surprise {
      margin-top: 30px;

      color: #71806c;

      font-size: 36px;
      font-weight: normal;
    }

    .texte-surprise {
      font-size: 19px;
      font-style: italic;

      line-height: 1.6;
    }

    .retour {
      display: inline-block;

      margin-top: 20px;

      padding: 13px 22px;

      background: #71806c;

      color: white;

      text-decoration: none;

      border-radius: 30px;

      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    /* PETIT TREMBLEMENT */

    .tremble {
      animation: tremble 0.35s;
    }

    @keyframes tremble {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-7px); }
      50%  { transform: translateX(7px); }
      75%  { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    /* MOBILE */

    @media (max-width: 600px) {

      body {
        padding: 20px 15px;
      }

      .quiz {
        padding: 30px 18px;
      }

      h1 {
        font-size: 28px;
      }

      .question {
        font-size: 19px;
      }

      .reponses {
        grid-template-columns: 1fr;
      }

      .reponse {
        font-size: 16px;
        padding: 16px;
      }

      .titre-surprise {
        font-size: 28px;
      }
    }
  </style>
</head>


<body>

  <main class="contenu">


    <!-- LE QUIZ -->

    <div id="quiz" class="quiz">

      <div class="petit-titre">
        Le petit quiz des mariés
      </div>

      <div class="coeur">
        ❤️
      </div>

      <h1>
        Puisque tu as cliqué…
      </h1>

      <p class="question">
        Quelle est notre date de rencontre ?
      </p>


      <div class="reponses">

        <button
          class="reponse"
          onclick="mauvaiseReponse()">
          14 février 2023
        </button>

        <button
          class="reponse"
          onclick="bonneReponse()">
          25 janvier 2024
        </button>

        <button
          class="reponse"
          onclick="mauvaiseReponse()">
          17 juillet 2024
        </button>

        <button
          class="reponse"
          onclick="mauvaiseReponse()">
          25 janvier 2025
        </button>

      </div>


      <div id="message"></div>


      <button
        id="bouton-suite"
        onclick="afficherSurprise()">

        Découvrir la suite… ❤️

      </button>

    </div>



    <!-- LA SURPRISE -->

    <div id="surprise">

      <img
        src="catherine-freddy.jpg"
        class="photo"
        alt="Catherine et Freddy"
      >

      <h1 class="titre-surprise">
        On avait dit de ne pas cliquer !
      </h1>

      <div class="coeur">
        ❤️
      </div>

      <p class="texte-surprise">
        Bon… puisque tu es arrivé jusque-là,
        tu as bien mérité de découvrir notre petit secret !
      </p>

      <a
        href="index.html"
        class="retour">

        ← Retour au mariage

      </a>

    </div>

  </main>


  <script>

    function mauvaiseReponse() {

      const message =
        document.getElementById("message");

      const quiz =
        document.getElementById("quiz");


      message.innerHTML =
        "Sérieusement ?! 😂<br>Essaie encore…";

      message.className =
        "erreur";


      quiz.classList.remove("tremble");

      void quiz.offsetWidth;

      quiz.classList.add("tremble");
    }



    function bonneReponse() {

      const message =
        document.getElementById("message");

      const bouton =
        document.getElementById("bouton-suite");


      message.innerHTML =
        "Bien joué ! ❤️<br>Tu nous connais bien !";

      message.className =
        "bravo";


      bouton.style.display =
        "inline-block";
    }



    function afficherSurprise() {

      document.getElementById("quiz").style.display =
        "none";

      document.getElementById("surprise").style.display =
        "block";

      window.scrollTo(0, 0);
    }

  </script>

</body>

</html>
