<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>On avait dit de ne pas cliquer !</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 20px;

      font-family: Georgia, "Times New Roman", serif;
      text-align: center;

      background:
        radial-gradient(
          circle at center,
          #ffffff 0%,
          #f8f4ec 55%,
          #e9e2d5 100%
        );

      color: #3f493f;
    }

    .contenu {
      width: 100%;
      max-width: 650px;
    }

    .photo {
      width: 100%;
      max-width: 500px;
      max-height: 60vh;
      object-fit: cover;

      border-radius: 18px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.15);
    }

    h1 {
      margin: 30px 0 10px;

      font-size: 36px;
      font-weight: normal;

      color: #71806c;
    }

    .coeur {
      font-size: 30px;
      margin: 15px 0;
    }

    .retour {
      display: inline-block;

      margin-top: 25px;
      padding: 12px 22px;

      background: #71806c;
      color: white;

      text-decoration: none;

      border-radius: 30px;

      font-family: Arial, sans-serif;
      font-size: 14px;

      transition: 0.2s;
    }

    .retour:hover {
      transform: scale(1.04);
      background: #596653;
    }

    @media (max-width: 600px) {

      body {
        padding: 20px 16px;
      }

      .photo {
        max-height: 55vh;
      }

      h1 {
        font-size: 28px;
        line-height: 1.3;
      }
    }
  </style>
</head>

<body>

  <main class="contenu">

    <img
      src="catherine-freddy.jpg"
      class="photo"
      alt="Catherine et Freddy"
    >

    <h1>
      On avait dit de ne pas cliquer !
    </h1>

    <div class="coeur">
      ❤️
    </div>

    <a
      href="index.html"
      class="retour"
    >
      ← Bon… je retourne au mariage
    </a>

  </main>

</body>
</html>
