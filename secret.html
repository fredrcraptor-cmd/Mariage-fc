<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Le petit secret de Catherine & Freddy</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: #3f493f;

      background:
        radial-gradient(
          circle at center,
          #ffffff 0%,
          #f8f4ec 55%,
          #e9e2d5 100%
        );

      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 20px;
    }


    /* =========================
       CONTENEUR
       ========================= */

    .contenu {
      width: 100%;
      max-width: 600px;
    }


    /* =========================
       PETIT TITRE
       ========================= */

    .petit-titre {
      color: #71806c;

      font-family: Arial, sans-serif;
      font-size: 13px;

      text-transform: uppercase;
      letter-spacing: 3px;

      margin-bottom: 20px;
    }


    /* =========================
       CARTE DU QUIZ
       ========================= */

    .quiz {
      background: rgba(255,255,255,0.92);

      padding: 40px 30px;

      border-radius: 20px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.10);
    }


    .coeur {
      font-size: 35px;
      margin-bottom: 15px;
    }


    h1 {
      margin: 0 0 15px;

      color: #71806c;

      font-size: 34px;
      font-weight: normal;

      line-height: 1.3;
    }


    .question {
      font-size: 20px;
      line-height: 1.6;

      margin-bottom: 30px;
    }


    /* =========================
       RÉPONSES
       ========================= */

    .reponses {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }


    .reponse {
      border: 1px solid #d9ddd6;

      background: #faf8f3;

      color: #3f493f;

      padding: 16px 12px;

      border-radius: 14px;

      font-family: Arial, sans-serif;
      font-size: 15px;

      cursor: pointer;

      transition: 0.2s;
    }


    .reponse:hover {
      background: #71806c;
      color: white;

      transform: translateY(-2px);
    }


    /* =========================
       MESSAGE
       ========================= */

    #message {
      min-height: 45px;

      margin-top: 25px;

      font-size: 18px;

      line-height: 1.5;
    }


    .erreur {
      color: #9a5b55;
    }


    .succes {
      color: #71806c;
      font-weight: bold;
    }


    /* =========================
       BOUTON SUITE
       ========================= */

    #suite {
      display: none;

      margin-top: 10px;

      padding: 14px 25px;

      border: none;

      border-radius: 30px;

      background: #71806c;

      color: white;

      font-family: Arial, sans-serif;
      font-size: 15px;

      cursor: pointer;

      transition: 0.2s;
    }


    #suite:hover {
      background: #596653;
      transform: scale(1.04);
    }


    /* =========================
       PARTIE SECRÈTE
       ========================= */

    #secret {
      display: none;

      animation:
        apparition 0.8s ease;
    }


    .photo {
      display: block;

      width: 100%;
      max-width: 500px;

      max-height: 60vh;

      margin: auto;

      object-fit: cover;

      border-radius: 20px;

      box-shadow:
        0 12px 35px rgba(0,0,0,0.15);
    }


    .message-secret {
      margin: 30px 0 10px;

      color: #71806c;

      font-size: 36px;
      font-weight: normal;

      line-height: 1.3;
    }


    .petit-message {
      font-size: 20px;

      font-style: italic;

      margin: 15px 0;
    }


    /* =========================
       RETOUR
       ========================= */

    .retour {
      display: inline-block;

      margin-top: 25px;

      padding: 12px 22px;

      background: #71806c;

      color: white;

      text-decoration: none;

      border-radius: 30px;

      font-family: Arial, sans-serif;
      font-size: 14px;

      transition: 0.2s;
    }


    .retour:hover {
      background: #596653;

      transform: scale(1.04);
    }


    /* =========================
       ANIMATIONS
       ========================= */

    @keyframes apparition {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes tremble {

      0% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-8px);
      }

      40% {
        transform: translateX(8px);
      }

      60% {
        transform: translateX(-6px);
      }

      80% {
        transform: translateX(6px);
      }

      100% {
        transform: translateX(0);
      }

    }


    .tremble {
      animation:
        tremble 0.35s ease;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      body {
        padding: 20px 15px;
      }


      .quiz {
        padding: 30px 18px;
      }


      h1 {
        font-size: 28px;
      }


      .question {
        font-size: 18px;
      }


      .reponses {
        grid-template-columns: 1fr;
      }


      .reponse {
        min-height: 52px;

        font-size: 16px;
      }


      .photo {
        max-height: 55vh;

        border-radius: 15px;
      }


      .message-secret {
        font-size: 28px;
      }


      .petit-message {
        font-size: 18px;
      }

    }

  </style>

</head>


<body>


  <main class="contenu">


    <!-- =========================
         QUIZ
         ========================= -->

    <div id="quiz" class="quiz">


      <div class="petit-titre">
        Le petit quiz des mariés
      </div>


      <div class="coeur">
        ❤️
      </div>


      <h1>
        Alors, puisque tu as cliqué…
      </h1>


      <p class="question">
        Quelle est notre date de rencontre ?
      </p>


      <div class="reponses">


        <button
          class="reponse"
          data-bonne="false"
        >
          14 février 2023
        </button>


        <button
          class="reponse"
          data-bonne="true"
        >
          25 janvier 2024
        </button>


        <button
          class="reponse"
          data-bonne="false"
        >
          17 juillet 2024
        </button>


        <button
          class="reponse"
          data-bonne="false"
        >
          25 janvier 2025
        </button>


      </div>


      <div
        id="message"
        aria-live="polite"
      ></div>


      <button id="suite">
        Découvrir la suite… ❤️
      </button>


    </div>



    <!-- =========================
         SURPRISE
         ========================= -->

    <div id="secret">


      <img
        src="catherine-freddy.jpg"
        class="photo"
        alt="Catherine et Freddy"
      >


      <h1 class="message-secret">
        On avait dit de ne pas cliquer !
      </h1>


      <div class="coeur">
        ❤️
      </div>


      <p class="petit-message">
        Bon… maintenant que tu es là,
        autant profiter de la photo !
      </p>


      <a
        href="index.html"
        class="retour"
      >
        ← Bon… je retourne au mariage
      </a>


    </div>


  </main>



  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    const boutons =
      document.querySelectorAll(".reponse");

    const quiz =
      document.getElementById("quiz");

    const message =
      document.getElementById("message");

    const suite =
      document.getElementById("suite");

    const secret =
      document.getElementById("secret");


    boutons.forEach(function(bouton) {

      bouton.addEventListener(
        "click",
        function() {


          const bonneReponse =
            bouton.dataset.bonne === "true";


          /* MAUVAISE RÉPONSE */

          if (!bonneReponse) {

            message.innerHTML =
              "Sérieusement ?! 😂<br>Essaie encore…";

            message.className =
              "erreur";


            quiz.classList.remove(
              "tremble"
            );


            void quiz.offsetWidth;


            quiz.classList.add(
              "tremble"
            );


            return;
          }


          /* BONNE RÉPONSE */

          message.innerHTML =
            "Bien joué ! ❤️<br>Tu nous connais bien !";

          message.className =
            "succes";


          suite.style.display =
            "inline-block";


          /* Désactive les réponses */

          boutons.forEach(
            function(b) {

              b.disabled = true;

              b.style.cursor =
                "default";

            }
          );


          bouton.style.background =
            "#71806c";

          bouton.style.color =
            "white";

        }
      );

    });



    /* =========================
       AFFICHAGE DE LA SURPRISE
       ========================= */

    suite.addEventListener(
      "click",
      function() {


        quiz.style.display =
          "none";


        secret.style.display =
          "block";


        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });


      }
    );

  </script>


</body>

</html>
